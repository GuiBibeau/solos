name: evidence-summary
description: Upload an Evidence JSON as an artifact and render it in the job summary.

inputs:
  file:
    description: Path to the Evidence JSON produced by `solos dev verify --json`
    required: true

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.file }}
        path: ${{ inputs.file }}
        if-no-files-found: warn

    - name: Job summary
      shell: bash
      run: |
        f="${{ inputs.file }}"
        [ -s "$f" ] || { echo "no evidence file" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
        {
          echo "### Evidence: $(jq -r .scope "$f") on $(jq -r .sha "$f" | cut -c1-12) (ok=$(jq -r .ok "$f"), dirty=$(jq -r .dirty "$f"))"
          echo
          echo "| step | ok | ms | summary |"
          echo "|---|---|---|---|"
          jq -r '.steps[] | "| \(.name) | \(.ok) | \(.ms) | \(.summary | gsub("\\|"; "\\|")) |"' "$f"
          echo
          echo '```json'
          cat "$f"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
