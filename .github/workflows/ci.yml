name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One job at scope `full`: line limits, docs gate, format, lint, dependency rules, types, unit
  # tests, then integration tests on Surfpool (offline; no RPC key, no mainnet, no secrets).
  #
  # This used to be three jobs, one per scope. The scopes are cumulative (REQUIRED_STEPS in
  # apps/cli/src/evidence/schema.js), so `unit` re-ran every static step to add ~10s of tests and
  # `full` re-ran all of them again — roughly 3m30s of duplicated work per push. Splitting bought
  # no earlier signal either: `runSteps` stops at the first failing step, so a lint break still
  # reports here in ~90s and never reaches the integration tests.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # check:lines needs the merge-base with origin/main.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          surfpool: "true"
      # stdout is the Evidence JSON. stderr streams to this log and already carries the failing
      # step's full output, redacted and bounded to 64KB (apps/cli/src/evidence/diagnostics.js),
      # so there is nothing to recover by re-running the suite.
      - name: solos dev verify --scope full
        env:
          SURFNET_DIAGNOSTICS: "1"
        run: bun run solos dev verify --scope full --json > "$RUNNER_TEMP/evidence-full.json"
      - uses: ./.github/actions/evidence-summary
        if: always()
        with:
          name: evidence-full
          file: ${{ runner.temp }}/evidence-full.json

  # A release PR (ADR-0036) must pass the lever's check: branch release/x.y.z newer than the last
  # stable tag, both server.json versions equal to it, the notes file present, and for a major a
  # filled Migration section naming an existing ADR. Required on main; skipped on every other
  # branch, which branch protection counts as passing. Only release/<major.minor.patch> is a
  # release PR; another branch under release/ (a feature branch about releasing) is not one.
  release-check:
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
      - name: solos dev release check
        run: |
          case "$GITHUB_HEAD_REF" in
            release/[0-9]*.[0-9]*.[0-9]*) bun run solos dev release check --branch "$GITHUB_HEAD_REF" ;;
            *) echo "$GITHUB_HEAD_REF is not a release/<major.minor.patch> branch; nothing to check" ;;
          esac
