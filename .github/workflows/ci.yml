name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SURFPOOL_VERSION: "1.5.0"
  # eslint over the whole repo peaks above Node's default heap
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # Scope `check`: format, lint, dependency rules, types. Emits Evidence (ADR-0016).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: solos dev verify --scope check
        run: bun run solos dev verify --scope check --json > "$RUNNER_TEMP/evidence-check.json"
      - uses: ./.github/actions/evidence-summary
        if: always()
        with:
          name: evidence-check
          file: ${{ runner.temp }}/evidence-check.json

  # Scope `unit`: pure domain tests, no Surfpool.
  unit:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: solos dev verify --scope unit
        run: bun run solos dev verify --scope unit --json > "$RUNNER_TEMP/evidence-unit.json"
      - uses: ./.github/actions/evidence-summary
        if: always()
        with:
          name: evidence-unit
          file: ${{ runner.temp }}/evidence-unit.json

  # Scope `full`: integration tests on Surfpool, offline. No RPC key, no mainnet, no secrets.
  integration:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          surfpool: "true"
      - name: solos dev verify --scope full
        run: bun run solos dev verify --scope full --json > "$RUNNER_TEMP/evidence-full.json"
      - name: Show integration failure details
        if: failure()
        run: bun run solos dev test --filter '\[integration\]'
      - uses: ./.github/actions/evidence-summary
        if: always()
        with:
          name: evidence-full
          file: ${{ runner.temp }}/evidence-full.json
