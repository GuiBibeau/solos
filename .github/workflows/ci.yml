name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the pull request the way preview.yml classifies code, then `verify` always runs.
  # A workflow-level `paths` filter would skip the workflow and leave the required `verify`
  # check pending. This job always publishes `docs_only`; `verify` always runs and passes or
  # fails on the scope it chose. Pushes to main are never docs-only.
  #
  # Docs-only means every changed path (including a rename's old name) passes
  # `isDocsOnlyChange` in apps/cli/src/evidence/docs-path.js: `docs/**`, any `*.md`
  # (CONTEXT.md, AGENTS.md, ADRs, engine-qa.md), and `features/feature-map.json`.
  # apps/engine, the cap ledger, tick/strategy, swap and transfer builders, and any other
  # code, config, or workflow file fail that predicate. An empty file list fails closed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: github.event_name == 'pull_request'
        with:
          bun-version-file: .bun-version

      # Always writes docs_only. A skipped step's output is not the job output, so a
      # push to main and a pull request share this step.
      - name: Classify changed paths
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "docs_only=false"
            exit 0
          fi
          if ! files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')"; then
            echo "could not list pull request files; full verify"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # bun reads the path list on stdin and prints true or false. tr only strips
          # whitespace from that one word. Anything unexpected fails closed to full verify.
          docs_only="$(bun apps/cli/src/evidence/docs-path.js <<<"$files" | tr -d '[:space:]')"
          case "$docs_only" in
            true|false) ;;
            *)
              echo "classifier returned '${docs_only}'; full verify"
              docs_only=false
              ;;
          esac
          echo "$files"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "docs_only=${docs_only}"

  # One job. Docs-only pull requests run scope `check` (line limits, docs, format, lint,
  # dependency rules, types) and do not install Surfpool. Everything else runs scope `full`:
  # those static checks, unit tests, then integration tests on Surfpool (offline; no RPC key,
  # no mainnet, no secrets).
  #
  # This used to be three jobs, one per scope. The scopes are cumulative (REQUIRED_STEPS in
  # apps/cli/src/evidence/schema.js), so `unit` re-ran every static step to add ~10s of tests and
  # `full` re-ran all of them again — roughly 3m30s of duplicated work per push. Splitting bought
  # no earlier signal either: `runSteps` stops at the first failing step, so a lint break still
  # reports here in ~90s and never reaches the integration tests.
  verify:
    needs: changes
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # check:lines needs the merge-base with origin/main.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          surfpool: ${{ needs.changes.outputs.docs_only == 'true' && 'false' || 'true' }}
      # stdout is the Evidence JSON. stderr streams to this log and already carries the failing
      # step's full output, redacted and bounded to 64KB (apps/cli/src/evidence/diagnostics.js),
      # so there is nothing to recover by re-running the suite. A missing or failed classifier
      # leaves docs_only unset, which selects full.
      - name: solos dev verify
        env:
          SURFNET_DIAGNOSTICS: "1"
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          scope=full
          if [ "$DOCS_ONLY" = "true" ]; then scope=check; fi
          bun run solos dev verify --scope "$scope" --json > "$RUNNER_TEMP/evidence.json"
      - uses: ./.github/actions/evidence-summary
        if: always()
        with:
          name: ${{ needs.changes.outputs.docs_only == 'true' && 'evidence-check' || 'evidence-full' }}
          file: ${{ runner.temp }}/evidence.json

  # A release PR (ADR-0036) must pass the lever's check: branch release/x.y.z newer than the last
  # stable tag, both server.json versions equal to it, the notes file present, and for a major a
  # filled Migration section naming an existing ADR. Required on main; skipped on every other
  # branch, which branch protection counts as passing. Only release/<major.minor.patch> is a
  # release PR; another branch under release/ (a feature branch about releasing) is not one.
  release-check:
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
      - name: solos dev release check
        run: |
          case "$GITHUB_HEAD_REF" in
            release/[0-9]*.[0-9]*.[0-9]*) bun run solos dev release check --branch "$GITHUB_HEAD_REF" ;;
            *) echo "$GITHUB_HEAD_REF is not a release/<major.minor.patch> branch; nothing to check" ;;
          esac
