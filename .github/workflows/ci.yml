name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Surfpool
        run: |
          curl -sL https://run.surfpool.run/ | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Quality gates (format, lint, dependency rules, types)
        run: bun run check

      # Integration tests run Surfpool offline: no RPC key, no mainnet state, no secrets.
      - name: Tests
        run: bun test
