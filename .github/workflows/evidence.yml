name: evidence

# The head SHA does not exist until the push, so the synchronize run reads a body that
# cannot name it yet and fails. Editing the pull request body runs this check again;
# the live body comes from the API, not the event payload (a push payload is the body
# from before that paste). Title-only and base-only edits do not run the check.
#
# A skipped job still publishes a check, and GitHub treats skipped as success for a
# required check. Ignoring an edit under the name "evidence" would clear a real
# failure, so those runs are named evidence-ignored and use a concurrency group of
# their own. They cannot cancel the run that counts.
#
# Branch protection follows the latest evidence check for the head SHA. Concurrency
# cancels an in-progress run for that same pull request and SHA when a newer one
# starts, so a body edit supersedes the push that is about to fail on the stale body.
# A different SHA is a different required check and is not cancelled. Renovate and
# the changesets bot cannot run verify; their pull requests are proven by CI alone.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: "${{ (github.event.action == 'edited' && github.event.changes.body == null) && format('evidence-ignored-{0}-{1}', github.event.pull_request.number, github.run_id) || format('evidence-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}"
  cancel-in-progress: true

jobs:
  evidence:
    name: "${{ (github.event.action == 'edited' && github.event.changes.body == null) && 'evidence-ignored' || 'evidence' }}"
    if: >-
      !contains(fromJSON('["renovate[bot]", "github-actions[bot]"]'), github.event.pull_request.user.login) &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: Record the triggering activity
        run: echo "action=${{ github.event.action }} body_changed=${{ github.event.action == 'edited' && github.event.changes.body != null }}"
      - name: Fetch the live PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json body --jq .body > pr-body.md
      - name: solos dev evidence check
        run: bun run solos dev evidence check --body-file pr-body.md --sha "${{ github.event.pull_request.head.sha }}"
