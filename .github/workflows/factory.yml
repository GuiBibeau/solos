name: factory

# apps/factory is the eve software factory. Its CLI runs on Node 24 (ADR-0016); Bun installs it.
on:
  pull_request:
    paths:
      - "apps/factory/**"
      - "bun.lock"
      - ".github/workflows/factory.yml"
  push:
    branches: [main]
    paths:
      - "apps/factory/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/factory
    env:
      FACTORY_REPO: GuiBibeau/solos
      GITHUB_CONNECTOR: github/solos-factory
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: eve info (discovery diagnostics)
        run: node ./node_modules/.bin/eve info
      - name: Fast evals
        if: ${{ vars.FACTORY_EVALS == 'true' }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.FACTORY_EVAL_GATEWAY_KEY }}
        run: node ./node_modules/.bin/eve eval --tag fast
