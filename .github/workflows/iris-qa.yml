name: iris-qa

on:
  # Explicit opt-in on a reviewed PR head. Pushes do not spend credits.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: "Elfa endpoints to verify (consumes API credits)"
        type: choice
        default: elfa-market
        options: [elfa-market, iris]

permissions:
  contents: read

concurrency:
  group: iris-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  live-iris:
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (contains(fromJSON('["qa:iris", "qa:elfa-market"]'), github.event.label.name) &&
        github.event.pull_request.head.repo.full_name == github.repository))
    environment: iris-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SURFPOOL_VERSION: "1.3.1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          surfpool: "true"
      - name: Offline verification
        run: bun run solos dev verify --scope full --json > "$RUNNER_TEMP/evidence-offline.json"
      - name: Live CLI and MCP QA (2 Chat calls or 6 Free-plan data calls)
        env:
          ELFA_API_KEY: ${{ secrets.ELFA_API_KEY }}
          QA_SUITE: ${{ github.event.label.name == 'qa:iris' && 'iris' || inputs.suite || 'elfa-market' }}
        run: bun run solos dev verify --scope check --qa "$QA_SUITE" --json > "$RUNNER_TEMP/evidence-iris.json"
      - uses: ./.github/actions/evidence-summary
        if: always()
        with:
          name: evidence-offline
          file: ${{ runner.temp }}/evidence-offline.json
      - uses: ./.github/actions/evidence-summary
        if: always()
        with:
          name: evidence-iris
          file: ${{ runner.temp }}/evidence-iris.json
