name: project-intake

# New issues land in the solOS Project inbox; new PRs land in "In progress".
# Skips silently until the GH_PROJECT_* variables and GH_PROJECT_TOKEN secret exist.
on:
  issues:
    types: [opened, reopened, transferred]
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_PROJECT_OWNER: ${{ vars.GH_PROJECT_OWNER }}
      GH_PROJECT_NUMBER: ${{ vars.GH_PROJECT_NUMBER }}
      GH_PROJECT_ID: ${{ vars.GH_PROJECT_ID }}
      GH_PROJECT_EXECUTION_STAGE_FIELD_ID: ${{ vars.GH_PROJECT_EXECUTION_STAGE_FIELD_ID }}
      GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Add issue to inbox
        if: github.event_name == 'issues'
        env:
          CONTENT_URL: ${{ github.event.issue.html_url }}
          STAGE_OPTION_ID: ${{ vars.GH_PROJECT_STAGE_INBOX_OPTION_ID }}
        run: bash scripts/github/project-item.sh add-and-stage
      - name: Add pull request to in progress
        if: github.event_name == 'pull_request_target'
        env:
          CONTENT_URL: ${{ github.event.pull_request.html_url }}
          STAGE_OPTION_ID: ${{ vars.GH_PROJECT_STAGE_IN_PROGRESS_OPTION_ID }}
        run: bash scripts/github/project-item.sh add-and-stage
