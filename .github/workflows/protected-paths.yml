name: protected-paths

# Factory branches may not change the paths a human owns (ADR-0016). CODEOWNERS makes the
# review requirement visible; this check turns a violation into evidence the reviewer sees.
on:
  pull_request:

jobs:
  protected-paths:
    # Factory branches by prefix, plus any PR opened by a GitHub App, so a misnamed branch cannot slip past.
    if: startsWith(github.head_ref, 'factory/') || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on protected paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          protected='^(packages/actions/|docs/adr/|\.github/|eslint\.config\.js$|biome\.json$|\.dependency-cruiser\.cjs$|tsconfig\.json$|LICENSE$|CODEOWNERS$)'
          hits="$(git diff --name-only "$BASE" "$HEAD" | grep -E "$protected" || true)"
          if [ -n "$hits" ]; then
            echo "::error::factory branch touches protected paths:"
            echo "$hits"
            exit 1
          fi
          echo "no protected paths touched"
