name: release-cli

# A stable tag `solos@<major.minor.patch>` on a main commit releases the compiled solos binary
# (ADR-0035): macOS and Linux binaries built and smoke-tested on their own runners, a GitHub
# Release with SHA256SUMS, and, when vars.NPM_PUBLISH is "true", the npm launcher @solos-sh/cli
# plus one platform package per binary. npm authenticates with secrets.NPM_TOKEN when set, else
# through trusted publishing. A prerelease tag (a canary, ADR-0036) is not a stable release and
# every job here refuses it: canary.yml owns those.
on:
  push:
    tags: ["solos@*"]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !contains(github.ref_name, '-') }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-x64,linux-arm64
          - os: macos-latest
            targets: darwin-arm64,darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The tag must point at a commit on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::${GITHUB_REF_NAME} is not on main; release from a merged commit"
            exit 1
          }
      - uses: ./.github/actions/setup
      - name: Build and smoke-test
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#solos@}"
          bun run solos dev build --target "${{ matrix.targets }}" --outdir dist --version "$version" \
            --commit "$GITHUB_SHA" > "$RUNNER_TEMP/build-${{ matrix.os }}.json"
          cat "$RUNNER_TEMP/build-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/solos-*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          chmod +x solos-*
          sha256sum solos-* > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#solos@}"
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | SOLOS_VERSION=${version} sh"
            echo "# or: npm i -g @solos-sh/cli@${version}"
            echo '```'
            echo
            echo "Then \`solos login\` and \`solos connect claude\` (or codex, cursor)."
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
      # Idempotent, so a failed job can be re-run: an existing release gets its assets replaced.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/solos-* dist/SHA256SUMS --clobber
          else
            gh release create "$VERSION" dist/solos-* dist/SHA256SUMS \
              --verify-tag --title "solos ${VERSION#solos@}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      # The dist-tag is latest until the stable lane's auto-promotion lands (ADR-0036: staged,
      # then promote).
      - uses: ./.github/actions/publish-npm
        with:
          version: ${{ github.ref_name }}
          tag: latest
          publish: ${{ vars.NPM_PUBLISH }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          # npm verifies a provenance statement against the source repository and accepts only
          # public ones; a private repository publishes without provenance rather than failing.
          provenance: ${{ github.event.repository.private && 'false' || 'true' }}
