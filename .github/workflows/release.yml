name: release

# Changesets: opens/updates the "Version Packages" PR. Publishing @solos/actions to npm is
# intentionally disabled until the package is ready; flip vars.NPM_PUBLISH to "true" then.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Version PR (and publish when enabled)
        uses: changesets/action@v1
        with:
          version: bun run changeset version
          publish: ${{ vars.NPM_PUBLISH == 'true' && 'bun run changeset publish' || '' }}
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
